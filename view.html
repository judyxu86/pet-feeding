<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>喂养报告 - 上门喂养小助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="icons.js?v=5"></script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #ecd6f0;
            min-height: 100vh;
            padding-bottom: 2rem;
        }
        /* Sunset background: icon lilac at the top → soft rose → sunset orange-pink at the bottom.
           Fixed to the screen so the whole sunset is always visible while scrolling (works on iPhone too). */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background: linear-gradient(180deg, #ecd6f0 0%, #f6d4e3 50%, #ffcaa8 100%);
        }
        .cute-cat {
            width: 96px;
            animation: cat-bob 3s ease-in-out infinite;
            filter: drop-shadow(0 6px 8px rgba(139, 90, 60, 0.15));
        }
        .cat-eye {
            transform-box: fill-box;
            transform-origin: center;
            animation: cat-blink 4s infinite;
        }
        @keyframes cat-bob {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-4px) rotate(2deg); }
        }
        @keyframes cat-blink {
            0%, 92%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }
        .card-shadow {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .report-card {
            background: linear-gradient(135deg, #fff9f0 0%, #fff5e6 100%);
            border: 2px solid #d8b4fe;
        }
        .photo-preview {
            width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
        }
        .photo-preview-container {
            max-height: 400px;
            overflow-y: auto;
            border-radius: 12px;
        }
        .container-padding {
            padding-left: 1rem;
            padding-right: 1rem;
        }
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e9d5ff;
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .status-good {
            background-color: #d1fae5;
            color: #065f46;
        }
        .status-warning {
            background-color: #fef3c7;
            color: #92400e;
        }
        .status-alert {
            background-color: #fee2e2;
            color: #991b1b;
        }
        .info-row {
            display: flex;
            padding: 0.75rem 0;
            border-bottom: 1px solid #f3f4f6;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            width: 100px;
            flex-shrink: 0;
            color: #6b7280;
            font-size: 0.875rem;
        }
        .info-value {
            flex: 1;
            color: #1f2937;
        }
        .small-photo {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 8px;
            margin-top: 0.5rem;
        }
        /* 中文 / EN switch (top right, scrolls away with the page) */
        .report-lang-switch {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 40;
            background: #fff;
            border-radius: 999px;
            padding: 3px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .report-lang-btn {
            padding: 4px 11px;
            border-radius: 999px;
            font-size: 12px;
            color: #6b7280;
        }
        .report-lang-btn.active {
            background: #7c3aed;
            color: #fff;
        }
    </style>
</head>
<body class="container-padding">

            <p class="text-gray-600 mb-6" data-t="notFoundText">链接可能已过期或无效</p>
            <a href="index.html"

                <span data-t="backHome">返回首页</span>

    <script>
        // Firebase 配置
        const firebaseConfig = {
            apiKey: "AIzaSyDKfklrd57Ua42UG6wMo5btzCqaf_P84kM",
            authDomain: "pet-feeding-report.firebaseapp.com",
            projectId: "pet-feeding-report",
            storageBucket: "pet-feeding-report.firebasestorage.app",
            messagingSenderId: "252784779994",
            appId: "1:252784779994:web:0eeedf2387795fc62fbbe3"
        };

        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 获取报告ID
        const urlParams = new URLSearchParams(window.location.search);
        const reportId = urlParams.get('id');

        // 加载报告
        async function loadReport() {
            if (!reportId) {
                showError();
                return;
            }

            try {
                const doc = await db.collection('reports').doc(reportId).get();
                
                if (!doc.exists) {
                    showError();
                    return;
                }

                const data = doc.data();
                displayReport(data);

            } catch (error) {
                console.error('加载失败:', error);
                showError();
            }
        }

        function showError() {
            document.getElementById('loadingPage').classList.add('hidden');
            document.getElementById('errorPage').classList.remove('hidden');
        }

        // Saved report values are Chinese; this shows them in English
        const VALUE_EN = {
            '吃完了': 'Finished all', '吃了大部分': 'Ate most', '吃了一点': 'Ate a little', '没怎么吃': 'Barely ate',
            '吃得很香': 'Ate happily', '正常进食': 'Ate normally',
            '活泼好动': 'Lively', '正常': 'Normal', '比较安静': 'Quiet', '状态异常': 'Unwell',
            '偏软': 'Soft', '拉稀': 'Diarrhoea', '便秘': 'Constipated', '未发现': 'None found',
            '偏大': 'Large', '偏小': 'Small',
            '无异常': 'Normal', '颜色深': 'Dark', '颜色浅': 'Pale', '有血丝': 'Blood traces', '气味异常': 'Odd smell', '结块异常': 'Odd clumping',
            '未发现呕吐物': 'No vomit', '发现呕吐物': 'Vomit found',
            '毛球': 'Hairball', '未消化的食物': 'Undigested food', '液体/泡沫': 'Liquid/foam', '其他': 'Other',
            '干粮': 'Dry food', '湿粮': 'Wet food', '罐头': 'Canned food', '零食': 'Treats',
            '份': ' serve', '包': ' pouch', '罐': ' can', '根': ' stick'
        };

        function readSavedLang() {
            try { return localStorage.getItem('ssReportLang'); } catch (e) { return null; }
        }
        let lang = new URLSearchParams(location.search).get('lang') || readSavedLang()
            || ((navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en');
        if (lang !== 'zh' && lang !== 'en') lang = 'zh';

        function L(key) { return TEXT[lang][key] || TEXT.zh[key] || key; }
        function V(value) { return (lang === 'en' && value && VALUE_EN[value]) ? VALUE_EN[value] : value; }

        function applyLang() {
            document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
            document.querySelectorAll('[data-t]').forEach(el => { el.textContent = L(el.dataset.t); });
            document.querySelectorAll('.report-lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
        }

        function setLang(newLang) {
            lang = newLang;
            try { localStorage.setItem('ssReportLang', newLang); } catch (e) {}
            applyLang();
            if (currentReport) displayReport(currentReport);
        }

        let currentReport = null;

        function displayReport(data) {
            currentReport = data;
            const en = lang === 'en';
            const sep = en ? ', ' : '、';

            // 基本信息
            const petNames = data.petNames.join(' & ');
            const title = en ? `${petNames}'s ${L('reportTitle')}` : petNames + '的' + L('reportTitle');
            document.getElementById('headerTitle').textContent = title;
            document.title = title + L('docTitleFrom');
            document.getElementById('reportAddress').textContent = data.customerAddress;
            document.getElementById('reportOwner').textContent = data.ownerName;
            document.getElementById('ownerIcon').innerHTML = SSIcons.person(data.ownerGender, 22);

            const dateObj = new Date(data.date);
            let timeStr = data.startTime || data.time || '';
            if (data.endTime) timeStr += ` - ${data.endTime}`;
            const dayStr = en
                ? dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })
                : `${dateObj.getMonth() + 1}月${dateObj.getDate()}日`;
            document.getElementById('reportDateTime').textContent = `${dayStr} ${timeStr}`;

            // Times set with the 现在到达 / 现在离开 buttons (phone clock, not typed)
            const autoNote = document.getElementById('timeAutoNote');
            const autoKey = data.startTimeAuto && data.endTimeAuto ? 'autoBoth'
                : data.startTimeAuto ? 'autoStart'
                : data.endTimeAuto ? 'autoEnd' : '';
            autoNote.textContent = autoKey ? L(autoKey) : '';
            autoNote.classList.toggle('hidden', !autoKey);

            // 照片
            if (data.photo) {
                document.getElementById('reportPhoto').src = data.photo;
                document.getElementById('photoSection').classList.remove('hidden');
            }

            // 精神状态 (the badge is decided from the saved Chinese value)
            const moodRaw = data.moodStatus || '';
            document.getElementById('reportMood').textContent = V(moodRaw) || L('notRecorded');
            const moodBadge = document.getElementById('moodBadge');
            if (moodRaw.includes('活泼') || moodRaw.includes('正常')) {
                moodBadge.textContent = L('good');
                moodBadge.className = 'status-badge status-good';
            } else if (moodRaw.includes('安静')) {
                moodBadge.textContent = L('watch');
                moodBadge.className = 'status-badge status-warning';
            } else if (moodRaw.includes('异常')) {
                moodBadge.textContent = L('alert');
                moodBadge.className = 'status-badge status-alert';
            } else {
                moodBadge.className = 'status-badge hidden';
            }

            // 陪玩
            if (data.playInteraction && data.playDuration) {
                document.getElementById('reportPlay').textContent = en
                    ? `Played together for ${data.playDuration} min`
                    : `陪玩互动 ${data.playDuration} 分钟`;
                document.getElementById('playSection').classList.remove('hidden');
            }

            // 梳毛
            if (data.grooming) {
                document.getElementById('groomingSection').classList.remove('hidden');
            }

            // 宠物状态备注 (owner's own words, shown as written)
            if (data.petStatusNotes) {
                document.getElementById('reportPetStatusNotes').textContent = data.petStatusNotes;
                document.getElementById('petStatusNotesSection').classList.remove('hidden');
            }

            // 饮食: one food per line, e.g. "干粮(Purina) 20g" / "Dry food (Purina) 20g"
            let foodLines = data.feedingTypes || [];
            if (en && Array.isArray(data.feedingItems)) {
                foodLines = data.feedingItems.map(it => {
                    let s = V(it.type);
                    if (it.brand) s += ` (${it.brand})`;
                    if (it.amount) s += ` ${it.amount}${it.unit === 'g' ? 'g' : V(it.unit)}`;
                    return s;
                });
            }
            if (foodLines.length > 0) {
                const typesEl = document.getElementById('feedingTypes');
                typesEl.textContent = '';
                foodLines.forEach(line => {
                    const div = document.createElement('div');
                    div.textContent = line;
                    typesEl.appendChild(div);
                });
            } else {
                document.getElementById('feedingTypeRow').classList.add('hidden');
            }

            if (data.feedingAmount) {
                const unit = data.feedingUnit || 'g';
                document.getElementById('feedingAmount').textContent = `${data.feedingAmount}${unit === 'g' ? 'g' : V(unit)}`;
            } else {
                document.getElementById('feedingAmountRow').classList.add('hidden');
            }

            // 服务前进食
            if (data.eatingBefore) {
                document.getElementById('eatingBefore').textContent = V(data.eatingBefore);
                if (data.eatingBeforePhoto) {
                    document.getElementById('eatingBeforePhoto').src = data.eatingBeforePhoto;
                    document.getElementById('eatingBeforePhoto').classList.remove('hidden');
                }
            } else {
                document.getElementById('eatingBeforeRow').classList.add('hidden');
            }

            // 服务时进食
            if (data.eatingDuring) {
                document.getElementById('eatingDuring').textContent = V(data.eatingDuring);
                if (data.eatingDuringPhoto) {
                    document.getElementById('eatingDuringPhoto').src = data.eatingDuringPhoto;
                    document.getElementById('eatingDuringPhoto').classList.remove('hidden');
                }
            } else if (data.eatingStatus) {
                // 兼容旧数据
                document.getElementById('eatingDuring').textContent = V(data.eatingStatus);
            } else {
                document.getElementById('eatingDuringRow').classList.add('hidden');
            }

            document.getElementById('bowlStatus').textContent = data.bowlCleaned ? L('bowlYes') : L('bowlNo');
            document.getElementById('waterStatus').textContent = data.waterChanged ? L('waterYes') : L('waterNo');

            // 换水照片
            if (data.waterPhoto) {
                document.getElementById('waterPhoto').src = data.waterPhoto;
                document.getElementById('waterPhoto').classList.remove('hidden');
            }

            if (data.dietNotes) {
                document.getElementById('dietNotes').textContent = data.dietNotes;
                document.getElementById('dietNotesRow').classList.remove('hidden');
            }

            // 卫生
            let poopText = V(data.poopStatus) || L('notRecorded');
            if (data.poopHasHair) poopText += L('withHair');
            if (data.poopNotes) poopText += ` - ${data.poopNotes}`;
            document.getElementById('poopStatus').textContent = poopText;

            // 尿团（新格式）
            if (data.urineCount || data.urineSize) {
                let urineText = '';
                if (data.urineCount) urineText += en
                    ? `${data.urineCount} ${Number(data.urineCount) === 1 ? 'clump' : 'clumps'}`
                    : `${data.urineCount}个`;
                if (data.urineSize) urineText += (en && urineText ? ', ' : ' ') + V(data.urineSize);
                if (data.urineAbnormal && data.urineAbnormal !== '无异常') urineText += ` (${V(data.urineAbnormal)})`;
                if (data.urineNotes) urineText += ` - ${data.urineNotes}`;
                document.getElementById('urineStatus').textContent = urineText.trim() || L('notRecorded');
            } else if (data.urineStatus) {
                // 兼容旧数据
                document.getElementById('urineStatus').textContent = V(data.urineStatus);
            } else {
                document.getElementById('urineStatus').textContent = L('notRecorded');
            }

            // 排泄物照片
            if (data.wastePhoto) {
                document.getElementById('wastePhoto').src = data.wastePhoto;
                document.getElementById('wastePhotoSection').classList.remove('hidden');
            }

            // 呕吐
            if (data.vomitStatus === '发现呕吐物') {
                let vomitText = L('vomitFound');
                if (data.vomitTypes && data.vomitTypes.length > 0) {
                    const types = data.vomitTypes.map(V).join(sep);
                    vomitText += en ? ` (${types})` : `（${types}）`;
                }
                if (data.vomitNotes) {
                    vomitText += ` - ${data.vomitNotes}`;
                }
                document.getElementById('vomitContent').textContent = vomitText;
                document.getElementById('vomitSection').classList.remove('hidden');
                if (data.vomitPhoto) {
                    document.getElementById('vomitPhoto').src = data.vomitPhoto;
                    document.getElementById('vomitPhotoSection').classList.remove('hidden');
                }
            }

            // 环境检查 (rebuilt every time so it can switch language)
            const tick = '<span class="w-6 h-6 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-sm mr-3">✓</span>';
            const dash = '<span class="w-6 h-6 rounded-full bg-gray-100 text-gray-400 flex items-center justify-center text-sm mr-3">-</span>';
            function checkRow(id, done, yesKey, noKey) {
                document.getElementById(id).innerHTML = done
                    ? `${tick}<span class="text-gray-700">${L(yesKey)}</span>`
                    : `${dash}<span class="text-gray-400">${L(noKey)}</span>`;
            }
            checkRow('doorCheck', data.doorWindowChecked, 'door', 'doorNo');
            checkRow('utilityCheck', data.utilitiesChecked, 'utility', 'utilityNo');
            checkRow('surroundingCheck', data.surroundingCleaned, 'surrounding', 'surroundingNo');
            checkRow('trashCheck', data.trashHandled, 'trash', 'trashNo');

            // 备注
            if (data.notes) {
                document.getElementById('reportNotes').textContent = data.notes;
                document.getElementById('notesSection').classList.remove('hidden');
            }

            // 显示报告页
            document.getElementById('loadingPage').classList.add('hidden');
            document.getElementById('reportPage').classList.remove('hidden');
        }

        applyLang();

        // 页面加载时获取报告
        loadReport();
    </script>
</body>
</html>
