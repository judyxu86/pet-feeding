<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>喂养报告 - 上门喂养小助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="icons.js?v=5"></script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f5e6ff 0%, #fff5e6 100%);
            min-height: 100vh;
            padding-bottom: 2rem;
        }
        .cute-cat {
            width: 96px;
            animation: cat-bob 3s ease-in-out infinite;
            filter: drop-shadow(0 6px 8px rgba(139, 90, 60, 0.15));
        }
        .cat-eye {
            transform-box: fill-box;
            transform-origin: center;
            animation: cat-blink 4s infinite;
        }
        @keyframes cat-bob {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-4px) rotate(2deg); }
        }
        @keyframes cat-blink {
            0%, 92%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }
        .card-shadow {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .report-card {
            background: linear-gradient(135deg, #fff9f0 0%, #fff5e6 100%);
            border: 2px solid #d8b4fe;
        }
        .photo-preview {
            width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
        }
        .photo-preview-container {
            max-height: 400px;
            overflow-y: auto;
            border-radius: 12px;
        }
        .container-padding {
            padding-left: 1rem;
            padding-right: 1rem;
        }
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e9d5ff;
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .status-good {
            background-color: #d1fae5;
            color: #065f46;
        }
        .status-warning {
            background-color: #fef3c7;
            color: #92400e;
        }
        .status-alert {
            background-color: #fee2e2;
            color: #991b1b;
        }
        .info-row {
            display: flex;
            padding: 0.75rem 0;
            border-bottom: 1px solid #f3f4f6;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            width: 100px;
            flex-shrink: 0;
            color: #6b7280;
            font-size: 0.875rem;
        }
        .info-value {
            flex: 1;
            color: #1f2937;
        }
        .small-photo {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 8px;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body class="container-padding">
    <a id="backToApp" href="index.html#history" style="display:none;position:fixed;top:12px;left:12px;z-index:50;background:#fff;color:#7e22ce;border:1px solid #d8b4fe;border-radius:999px;padding:6px 14px;font-size:14px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.08)">← 返回历史记录</a>
    <script>if (new URLSearchParams(location.search).get('from') === 'history') document.getElementById('backToApp').style.display = 'inline-block';</script>
    <!-- 加载中 -->
    <div id="loadingPage" class="max-w-md mx-auto">
        <div class="loading-container">
            <div class="loading-spinner mb-4"></div>
            <p class="text-gray-600">加载报告中...</p>
        </div>
    </div>

    <!-- 错误页 -->
    <div id="errorPage" class="max-w-md mx-auto pt-6 hidden">
        <div class="text-center py-20">
            <div class="mb-4 flex justify-center" data-ss-icon="catUnwell" data-size="80"></div>
            <h1 class="text-xl font-bold text-gray-800 mb-2">报告不存在</h1>
            <p class="text-gray-600 mb-6">链接可能已过期或无效</p>
            <a href="index.html" 
                class="inline-block px-6 py-3 bg-purple-500 text-white rounded-xl font-medium hover:bg-purple-600 transition-all">
                返回首页
            </a>
        </div>
    </div>

    <!-- 报告页 -->
    <div id="reportPage" class="max-w-md mx-auto pt-6 hidden">
        <!-- 头部 -->
        <div class="text-center mb-6">
            <div class="cute-cat mx-auto mb-3" aria-hidden="true">
                <svg viewBox="0 0 120 110" width="96" height="88">
                    <!-- ears -->
                    <path d="M22 46 L26 10 Q28 4 34 8 L54 26 Z" fill="#fcd9b6" stroke="#8b5a3c" stroke-width="3" stroke-linejoin="round"/>
                    <path d="M98 46 L94 10 Q92 4 86 8 L66 26 Z" fill="#fcd9b6" stroke="#8b5a3c" stroke-width="3" stroke-linejoin="round"/>
                    <path d="M29 34 L31 17 L44 28 Z" fill="#f9a8d4"/>
                    <path d="M91 34 L89 17 L76 28 Z" fill="#f9a8d4"/>
                    <!-- face -->
                    <ellipse cx="60" cy="62" rx="46" ry="40" fill="#fde7cf" stroke="#8b5a3c" stroke-width="3"/>
                    <!-- forehead stripes -->
                    <path d="M52 26 Q54 33 52 38 M60 24 L60 36 M68 26 Q66 33 68 38" stroke="#e9b98c" stroke-width="3" stroke-linecap="round" fill="none"/>
                    <!-- eyes -->
                    <ellipse class="cat-eye" cx="42" cy="60" rx="6.5" ry="8" fill="#3b2a20"/>
                    <ellipse class="cat-eye" cx="78" cy="60" rx="6.5" ry="8" fill="#3b2a20"/>
                    <circle cx="44.5" cy="56.5" r="2.6" fill="#fff"/>
                    <circle cx="80.5" cy="56.5" r="2.6" fill="#fff"/>
                    <!-- blush -->
                    <ellipse cx="30" cy="74" rx="8" ry="5" fill="#f9a8d4" opacity=".7"/>
                    <ellipse cx="90" cy="74" rx="8" ry="5" fill="#f9a8d4" opacity=".7"/>
                    <!-- nose + mouth -->
                    <path d="M56 70 Q60 67 64 70 Q60 75 56 70 Z" fill="#f472b6"/>
                    <path d="M60 74 Q60 80 54 80 M60 74 Q60 80 66 80" stroke="#8b5a3c" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                    <!-- whiskers -->
                    <path d="M18 66 L4 63 M18 72 L4 74 M102 66 L116 63 M102 72 L116 74" stroke="#8b5a3c" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 mb-1" id="headerTitle">喂养报告</h1>
            <p class="text-gray-500 text-sm">来自Amber的每日记录</p>
        </div>

        <!-- 基本信息卡片 -->
        <div class="report-card rounded-2xl p-5 card-shadow mb-4">
            <div class="mb-4">
                <p class="text-sm text-gray-500">服务时间</p>
                <p class="text-lg font-medium text-gray-800" id="reportDateTime"></p>
            </div>
            <div class="bg-white/50 rounded-xl p-3">
                <div class="flex items-center text-sm">
                    <span class="mr-2 flex-shrink-0" data-ss-icon="house" data-size="22"></span>
                    <span class="text-gray-700" id="reportAddress"></span>
                </div>
                <div class="flex items-center text-sm mt-2">
                    <span class="mr-2 flex-shrink-0" id="ownerIcon"></span>
                    <span class="text-gray-700" id="reportOwner"></span>
                </div>
            </div>
        </div>

        <!-- 照片（如果有） -->
        <div id="photoSection" class="bg-white rounded-2xl p-5 card-shadow mb-4 hidden">
            <h3 class="font-semibold text-gray-800 mb-3 flex items-center">
                <span class="mr-2 flex-shrink-0" data-ss-icon="cameraSparkle" data-size="26"></span> 今日精选可爱瞬间
            </h3>
            <div class="photo-preview-container">
                <img id="reportPhoto" class="photo-preview">
            </div>
        </div>

        <!-- 精神状态 -->
        <div class="bg-white rounded-2xl p-5 card-shadow mb-4">
            <h3 class="font-semibold text-gray-800 mb-3 flex items-center">
                <span class="mr-2 flex-shrink-0" data-ss-icon="cat" data-size="26"></span> 宠物状态
            </h3>
            <div class="flex items-center justify-between">
                <span id="reportMood" class="text-lg"></span>
                <span id="moodBadge" class="status-badge"></span>
            </div>
            <div id="playSection" class="mt-3 pt-3 border-t border-gray-100 hidden">
                <div class="flex items-center text-gray-600">
                    <span class="mr-2 flex-shrink-0" data-ss-icon="yarn" data-size="20"></span>
                    <span id="reportPlay"></span>
                </div>
            </div>
            <div id="groomingSection" class="mt-3 pt-3 border-t border-gray-100 hidden">
                <div class="flex items-center text-gray-600">
                    <span class="mr-2 flex-shrink-0" data-ss-icon="sparkles" data-size="20"></span>
                    <span>已梳毛</span>
                </div>
            </div>
            <div id="petStatusNotesSection" class="mt-3 pt-3 border-t border-gray-100 hidden">
                <div class="text-gray-600">
                    <span class="mr-1 inline-block align-middle" data-ss-icon="memo" data-size="20"></span>
                    <span id="reportPetStatusNotes"></span>
                </div>
            </div>
        </div>

        <!-- 饮食照料 -->
        <div class="bg-white rounded-2xl p-5 card-shadow mb-4">
            <h3 class="font-semibold text-gray-800 mb-3 flex items-center">
                <span class="mr-2 flex-shrink-0" data-ss-icon="bowl" data-size="26"></span> 饮食照料
            </h3>
            <div id="feedingContent">
                <div class="info-row" id="feedingTypeRow">
                    <span class="info-label">喂食种类/量</span>
                    <span class="info-value" id="feedingTypes"></span>
                </div>
                <div class="info-row" id="feedingAmountRow">
                    <span class="info-label">喂食量</span>
                    <span class="info-value" id="feedingAmount"></span>
                </div>
                <div class="info-row" id="eatingBeforeRow">
                    <span class="info-label">服务前进食</span>
                    <div class="info-value">
                        <span id="eatingBefore"></span>
                        <img id="eatingBeforePhoto" class="small-photo hidden">
                    </div>
                </div>
                <div class="info-row" id="eatingDuringRow">
                    <span class="info-label">服务时进食</span>
                    <div class="info-value">
                        <span id="eatingDuring"></span>
                        <img id="eatingDuringPhoto" class="small-photo hidden">
                    </div>
                </div>
                <div class="info-row" id="bowlRow">
                    <span class="info-label">碗清洗</span>
                    <span class="info-value" id="bowlStatus"></span>
                </div>
                <div class="info-row" id="waterRow">
                    <span class="info-label">换水</span>
                    <div class="info-value">
                        <span id="waterStatus"></span>
                        <img id="waterPhoto" class="small-photo hidden">
                    </div>
                </div>
                <div class="info-row hidden" id="dietNotesRow">
                    <span class="info-label">备注</span>
                    <span class="info-value" id="dietNotes"></span>
                </div>
            </div>
        </div>

        <!-- 卫生清洁 -->
        <div class="bg-white rounded-2xl p-5 card-shadow mb-4">
            <h3 class="font-semibold text-gray-800 mb-3 flex items-center">
                <span class="mr-2 flex-shrink-0" data-ss-icon="litter" data-size="26"></span> 卫生清洁
            </h3>
            <div id="cleaningContent">
                <div class="info-row">
                    <span class="info-label">排便情况</span>
                    <span class="info-value" id="poopStatus"></span>
                </div>
                <div class="info-row" id="urineRow">
                    <span class="info-label">尿团</span>
                    <span class="info-value" id="urineStatus"></span>
                </div>
                <div id="wastePhotoSection" class="mt-3 hidden">
                    <p class="text-sm text-gray-500 mb-2">排泄物照片</p>
                    <img id="wastePhoto" class="small-photo">
                </div>
            </div>
        </div>

        <!-- 呕吐情况（如果有） -->
        <div id="vomitSection" class="bg-white rounded-2xl p-5 card-shadow mb-4 hidden">
            <h3 class="font-semibold text-gray-800 mb-3 flex items-center">
                <span class="mr-2 flex-shrink-0" data-ss-icon="catUnwell" data-size="26"></span> 呕吐情况
            </h3>
            <div class="bg-yellow-50 rounded-xl p-3">
                <p id="vomitContent" class="text-yellow-800"></p>
            </div>
            <div id="vomitPhotoSection" class="mt-3 hidden">
                <p class="text-sm text-gray-500 mb-2">呕吐物照片</p>
                <img id="vomitPhoto" class="small-photo">
            </div>
        </div>

        <!-- 环境检查 -->
        <div class="bg-white rounded-2xl p-5 card-shadow mb-4">
            <h3 class="font-semibold text-gray-800 mb-3 flex items-center">
                <span class="mr-2 flex-shrink-0" data-ss-icon="houseCheck" data-size="26"></span> 环境检查
            </h3>
            <div class="space-y-2">
                <div class="flex items-center" id="doorCheck">
                    <span class="w-6 h-6 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-sm mr-3">✓</span>
                    <span class="text-gray-700">门窗已确认锁好</span>
                </div>
                <div class="flex items-center" id="utilityCheck">
                    <span class="w-6 h-6 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-sm mr-3">✓</span>
                    <span class="text-gray-700">水电/空调已复原</span>
                </div>
                <div class="flex items-center" id="surroundingCheck">
                    <span class="w-6 h-6 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-sm mr-3">✓</span>
                    <span class="text-gray-700">周边清洁/补砂</span>
                </div>
                <div class="flex items-center" id="trashCheck">
                    <span class="w-6 h-6 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-sm mr-3">✓</span>
                    <span class="text-gray-700">垃圾已处理</span>
                </div>
            </div>
        </div>

        <!-- 备注（如果有） -->
        <div id="notesSection" class="bg-white rounded-2xl p-5 card-shadow mb-4 hidden">
            <h3 class="font-semibold text-gray-800 mb-3 flex items-center">
                <span class="mr-2 flex-shrink-0" data-ss-icon="memo" data-size="26"></span> 其他备注
            </h3>
            <p id="reportNotes" class="text-gray-700"></p>
        </div>

        <!-- 底部 -->
        <div class="text-center py-6">
            <p class="text-gray-400 text-sm flex items-center justify-center gap-2"><span data-ss-icon="paw" data-size="16"></span>感谢信任，期待下次服务<span data-ss-icon="paw" data-size="16"></span></p>
        </div>
    </div>

    <script>
        // Firebase 配置
        const firebaseConfig = {
            apiKey: "AIzaSyDKfklrd57Ua42UG6wMo5btzCqaf_P84kM",
            authDomain: "pet-feeding-report.firebaseapp.com",
            projectId: "pet-feeding-report",
            storageBucket: "pet-feeding-report.firebasestorage.app",
            messagingSenderId: "252784779994",
            appId: "1:252784779994:web:0eeedf2387795fc62fbbe3"
        };

        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 获取报告ID
        const urlParams = new URLSearchParams(window.location.search);
        const reportId = urlParams.get('id');

        // 加载报告
        async function loadReport() {
            if (!reportId) {
                showError();
                return;
            }

            try {
                const doc = await db.collection('reports').doc(reportId).get();
                
                if (!doc.exists) {
                    showError();
                    return;
                }

                const data = doc.data();
                displayReport(data);

            } catch (error) {
                console.error('加载失败:', error);
                showError();
            }
        }

        function showError() {
            document.getElementById('loadingPage').classList.add('hidden');
            document.getElementById('errorPage').classList.remove('hidden');
        }

        function displayReport(data) {
            // 基本信息
            const petNames = data.petNames.join(' & ');
            document.getElementById('headerTitle').textContent = petNames + '的喂养报告';
            document.title = petNames + '的喂养报告 - 来自Amber';
            document.getElementById('reportAddress').textContent = data.customerAddress;
            document.getElementById('reportOwner').textContent = data.ownerName;
            document.getElementById('ownerIcon').innerHTML = SSIcons.person(data.ownerGender, 22);
            
            const dateObj = new Date(data.date);
            let timeStr = data.startTime || data.time || '';
            if (data.endTime) timeStr += ` - ${data.endTime}`;
            const dateStr = `${dateObj.getMonth() + 1}月${dateObj.getDate()}日 ${timeStr}`;
            document.getElementById('reportDateTime').textContent = dateStr;

            // 照片
            if (data.photo) {
                document.getElementById('reportPhoto').src = data.photo;
                document.getElementById('photoSection').classList.remove('hidden');
            }

            // 精神状态
            const moodText = data.moodStatus || '未记录';
            document.getElementById('reportMood').textContent = moodText;
            
            const moodBadge = document.getElementById('moodBadge');
            if (moodText.includes('活泼') || moodText.includes('正常')) {
                moodBadge.textContent = '状态良好';
                moodBadge.className = 'status-badge status-good';
            } else if (moodText.includes('安静')) {
                moodBadge.textContent = '需关注';
                moodBadge.className = 'status-badge status-warning';
            } else if (moodText.includes('异常')) {
                moodBadge.textContent = '需注意';
                moodBadge.className = 'status-badge status-alert';
            } else {
                moodBadge.classList.add('hidden');
            }

            // 陪玩
            if (data.playInteraction && data.playDuration) {
                document.getElementById('reportPlay').textContent = `陪玩互动 ${data.playDuration} 分钟`;
                document.getElementById('playSection').classList.remove('hidden');
            }

            // 梳毛
            if (data.grooming) {
                document.getElementById('groomingSection').classList.remove('hidden');
            }

            // 宠物状态备注
            if (data.petStatusNotes) {
                document.getElementById('reportPetStatusNotes').textContent = data.petStatusNotes;
                document.getElementById('petStatusNotesSection').classList.remove('hidden');
            }

            // 饮食
            if (data.feedingTypes && data.feedingTypes.length > 0) {
                // One food per line, e.g. "干粮(Purina) 20g"
                const typesEl = document.getElementById('feedingTypes');
                typesEl.textContent = '';
                data.feedingTypes.forEach(t => {
                    const line = document.createElement('div');
                    line.textContent = t;
                    typesEl.appendChild(line);
                });
            } else {
                document.getElementById('feedingTypeRow').classList.add('hidden');
            }

            if (data.feedingAmount) {
                document.getElementById('feedingAmount').textContent = `${data.feedingAmount}${data.feedingUnit || 'g'}`;
            } else {
                document.getElementById('feedingAmountRow').classList.add('hidden');
            }

            // 服务前进食
            if (data.eatingBefore) {
                document.getElementById('eatingBefore').textContent = data.eatingBefore;
                if (data.eatingBeforePhoto) {
                    document.getElementById('eatingBeforePhoto').src = data.eatingBeforePhoto;
                    document.getElementById('eatingBeforePhoto').classList.remove('hidden');
                }
            } else {
                document.getElementById('eatingBeforeRow').classList.add('hidden');
            }

            // 服务时进食
            if (data.eatingDuring) {
                document.getElementById('eatingDuring').textContent = data.eatingDuring;
                if (data.eatingDuringPhoto) {
                    document.getElementById('eatingDuringPhoto').src = data.eatingDuringPhoto;
                    document.getElementById('eatingDuringPhoto').classList.remove('hidden');
                }
            } else if (data.eatingStatus) {
                // 兼容旧数据
                document.getElementById('eatingDuring').textContent = data.eatingStatus;
            } else {
                document.getElementById('eatingDuringRow').classList.add('hidden');
            }
            
            document.getElementById('bowlStatus').textContent = data.bowlCleaned ? '已清洗 ✓' : '未清洗';
            document.getElementById('waterStatus').textContent = data.waterChanged ? '已换水 ✓' : '未换水';
            
            // 换水照片
            if (data.waterPhoto) {
                document.getElementById('waterPhoto').src = data.waterPhoto;
                document.getElementById('waterPhoto').classList.remove('hidden');
            }
            
            if (data.dietNotes) {
                document.getElementById('dietNotes').textContent = data.dietNotes;
                document.getElementById('dietNotesRow').classList.remove('hidden');
            }

            // 卫生
            let poopText = data.poopStatus || '未记录';
            if (data.poopHasHair) poopText += ' (有毛发)';
            if (data.poopNotes) poopText += ` - ${data.poopNotes}`;
            document.getElementById('poopStatus').textContent = poopText;
            
            // 尿团（新格式）
            if (data.urineCount || data.urineSize) {
                let urineText = '';
                if (data.urineCount) urineText += `${data.urineCount}个`;
                if (data.urineSize) urineText += ` ${data.urineSize}`;
                if (data.urineAbnormal && data.urineAbnormal !== '无异常') urineText += ` (${data.urineAbnormal})`;
                if (data.urineNotes) urineText += ` - ${data.urineNotes}`;
                document.getElementById('urineStatus').textContent = urineText || '未记录';
            } else if (data.urineStatus) {
                // 兼容旧数据
                document.getElementById('urineStatus').textContent = data.urineStatus;
            } else {
                document.getElementById('urineStatus').textContent = '未记录';
            }

            // 排泄物照片
            if (data.wastePhoto) {
                document.getElementById('wastePhoto').src = data.wastePhoto;
                document.getElementById('wastePhotoSection').classList.remove('hidden');
            }

            // 呕吐
            if (data.vomitStatus === '发现呕吐物') {
                let vomitText = '发现呕吐物';
                if (data.vomitTypes && data.vomitTypes.length > 0) {
                    vomitText += `（${data.vomitTypes.join('、')}）`;
                }
                if (data.vomitNotes) {
                    vomitText += ` - ${data.vomitNotes}`;
                }
                document.getElementById('vomitContent').textContent = vomitText;
                document.getElementById('vomitSection').classList.remove('hidden');
                if (data.vomitPhoto) {
                    document.getElementById('vomitPhoto').src = data.vomitPhoto;
                    document.getElementById('vomitPhotoSection').classList.remove('hidden');
                }
            }

            // 环境检查
            const doorCheck = document.getElementById('doorCheck');
            const utilityCheck = document.getElementById('utilityCheck');
            const surroundingCheck = document.getElementById('surroundingCheck');
            const trashCheck = document.getElementById('trashCheck');
            
            if (!data.doorWindowChecked) {
                doorCheck.innerHTML = `
                    <span class="w-6 h-6 rounded-full bg-gray-100 text-gray-400 flex items-center justify-center text-sm mr-3">-</span>
                    <span class="text-gray-400">门窗未检查</span>
                `;
            }
            
            if (!data.utilitiesChecked) {
                utilityCheck.innerHTML = `
                    <span class="w-6 h-6 rounded-full bg-gray-100 text-gray-400 flex items-center justify-center text-sm mr-3">-</span>
                    <span class="text-gray-400">水电/空调未检查</span>
                `;
            }

            if (!data.surroundingCleaned) {
                surroundingCheck.innerHTML = `
                    <span class="w-6 h-6 rounded-full bg-gray-100 text-gray-400 flex items-center justify-center text-sm mr-3">-</span>
                    <span class="text-gray-400">周边未清洁</span>
                `;
            }

            if (!data.trashHandled) {
                trashCheck.innerHTML = `
                    <span class="w-6 h-6 rounded-full bg-gray-100 text-gray-400 flex items-center justify-center text-sm mr-3">-</span>
                    <span class="text-gray-400">垃圾未处理</span>
                `;
            }

            // 备注
            if (data.notes) {
                document.getElementById('reportNotes').textContent = data.notes;
                document.getElementById('notesSection').classList.remove('hidden');
            }

            // 显示报告页
            document.getElementById('loadingPage').classList.add('hidden');
            document.getElementById('reportPage').classList.remove('hidden');
        }

        // 页面加载时获取报告
        loadReport();
    </script>
</body>
</html>
